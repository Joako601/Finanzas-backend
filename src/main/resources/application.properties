spring.application.name=backend
server.port=${PORT:8090}

# Base de datos PostgreSQL (configurar por variables de entorno o application-dev.properties)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finanzas}
spring.datasource.username=${DB_USERNAME:finanzas}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA y migraciones Flyway (el esquema lo gobierna Flyway, nunca ddl-auto=update)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Seguridad Firebase JWT (obligatorio vía variable de entorno o application-dev.properties)
finanzas.firebase.project-id=${FIREBASE_PROJECT_ID:}
finanzas.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8090}

# Swagger / OpenAPI deshabilitado por defecto en producción (habilitar solo en dev con SWAGGER_ENABLED=true)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
finanzas.openapi.enabled=${SWAGGER_ENABLED:false}

# APIs publicas externas (con cache y fallback en PostgreSQL)
finanzas.scheduling.enabled=${FINANZAS_SCHEDULING_ENABLED:true}
finanzas.external.frankfurter.base-url=https://api.frankfurter.dev/v1
finanzas.external.banxico.base-url=https://www.banxico.org.mx/SieAPIRest/service/v1
finanzas.external.banxico.token=${BANXICO_TOKEN:}
finanzas.external.nager.base-url=https://date.nager.at/api/v3

# Limite de subida para respaldos cifrados Zero-Knowledge (15 MB)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Errores RFC 7807 sin filtrar detalles internos (OWASP)
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
